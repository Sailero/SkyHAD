name: tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      MPLBACKEND: Agg
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip "setuptools>=77" wheel
      - run: python -m pip wheel . --no-deps --wheel-dir "${{ runner.temp }}/skyhad-wheels"
      - name: Fresh headless installed-wheel smoke
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ['RUNNER_TEMP'])
          runtime = root / 'skyhad-headless'
          subprocess.run([sys.executable, '-m', 'venv', str(runtime)], check=True)
          python = runtime / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          wheel, = (root / 'skyhad-wheels').glob('*.whl')
          subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True)
          code = '''
          import importlib.util
          from importlib.metadata import distribution
          from pathlib import Path
          import sys
          import had_env, skyhad_workbench
          from skyhad_workbench.session import SimulationSession
          from skyhad_workbench.agent_session import FlightSession
          for module in (had_env, skyhad_workbench):
              assert Path(module.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert all(importlib.util.find_spec(name) is None for name in ('pygame', 'PySide6', 'matplotlib', 'torch'))
          package = distribution('had-env')
          assert package.version == had_env.__version__ == skyhad_workbench.__version__
          assert package.metadata['License-Expression'] == 'MIT'
          license_file, = [p for p in package.files if str(p).endswith('.dist-info/licenses/LICENSE')]
          assert 'Copyright (c) 2026 Saileron' in package.locate_file(license_file).read_text()
          entries = {e.name: e.value for e in package.entry_points}
          assert entries['skyhad-workbench'] == entries['had-workbench'] == 'skyhad_workbench.cli:main'
          env = had_env.make_env(red_count=1, blue_count=1, max_cycles=1)
          try:
              env.reset(seed=11)
              result = env.step({a: 0 for a in env.agents})
              assert len(result) == 5
              info = next(iter(result[-1].values()))
              assert info['global_terminated'] or info['global_truncated']
          finally:
              env.close()
          assert not any(name in sys.modules for name in ('pygame', 'PySide6', 'matplotlib', 'torch'))
          print('headless installed wheel and MIT license: OK')
          '''
          subprocess.run([str(python), '-I', '-B', '-c', code], cwd=root, check=True)
          subprocess.run([str(python), '-I', '-B', '-m', 'skyhad_workbench', '--help'], cwd=root, check=True)
      - run: python -m pip install -e ".[viewer,test]"
      - run: python -B -m pytest -q -p no:cacheprovider
