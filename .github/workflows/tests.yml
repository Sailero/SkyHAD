name: tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - run: python -m pip install --upgrade pip "setuptools>=77" wheel
      - run: python -m pip wheel . --no-deps --wheel-dir "${{ runner.temp }}/skyhad-wheels"
      - name: Headless wheel runs without optional packages
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ['RUNNER_TEMP'])
          runtime = root / 'skyhad-headless'
          subprocess.run([sys.executable, '-m', 'venv', str(runtime)], check=True)
          python = runtime / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          wheel, = (root / 'skyhad-wheels').glob('*.whl')
          subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True)
          code = '''
          import sys
          from importlib.metadata import distribution
          import had_env
          assert distribution('had-env').version == had_env.__version__
          for model in ('particle', 'UAV_fixedwing', 'UAV_quadrotor'):
              env = had_env.make_env(env_agent_type=model, red_count=2, blue_count=2, max_cycles=2)
              env.reset(seed=11)
              while env.agents:
                  env.step({a: env.action_space(a).sample() for a in env.agents})
              env.close()
          assert not any(name in sys.modules for name in ('pygame', 'PySide6', 'vispy', 'imageio'))
          print('headless installed wheel: OK')
          '''
          subprocess.run([str(python), '-I', '-B', '-c', code], cwd=root, check=True)
      - run: python -m pip install -e ".[render,viewer3d,record,test]"
      - run: python -B -m pytest -q -p no:cacheprovider

  opengl-3d:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: '1'
      SKYHAD_REQUIRE_3D: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Qt XCB and software OpenGL runtime
        run: |
          sudo apt-get update
          # Runtime libraries from https://doc.qt.io/qt-6/linux-requirements.html
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1-mesa-dri libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-glx0
      - run: python -m pip install -e ".[render,viewer3d,test]"
      - run: xvfb-run -a python -B -m pytest tests/test_scene3d.py tests/test_native3d.py tests/test_native_view_modes.py -q -p no:cacheprovider
