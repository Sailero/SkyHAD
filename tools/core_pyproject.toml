[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "had-env"
dynamic = ["version"]
description = "SkyHAD core: aerial attack-defense environments with optional minimal 2D rendering"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<2", "scipy>=1.11.4,<2", "gymnasium>=1.0,<2", "pettingzoo>=1.24,<2"]

[project.optional-dependencies]
render = ["pygame>=2.5,<3"]
test = ["pytest>=8.4,<9"]

[project.urls]
Repository = "https://github.com/Sailero/SkyHAD"
Documentation = "https://github.com/Sailero/SkyHAD/tree/core/docs"

[tool.setuptools]
py-modules = ["make_env"]

[tool.setuptools.packages.find]
where = ["."]
include = ["had_env*"]

[tool.setuptools.package-data]
"had_env" = ["edition_manifest.json", "resources/*.png"]

[tool.setuptools.dynamic]
version = {attr = "had_env.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
