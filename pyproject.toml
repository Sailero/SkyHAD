[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "had-env"
dynamic = ["version"]
description = "SkyHAD: multi-agent air-defense environment with particle, fixed-wing and quadrotor models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["multi-agent reinforcement learning", "pettingzoo", "uav", "air defense", "simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11.4,<2",
  "gymnasium>=1.0,<2",
  "pettingzoo>=1.24,<2",
]

[project.optional-dependencies]
render = ["pygame>=2.5,<3"]
viewer3d = ["PySide6>=6.8,<7", "vispy>=0.17,<0.18"]
record = ["imageio>=2.31", "imageio-ffmpeg>=0.5"]
test = ["pytest>=8.4,<9"]

[project.urls]
Repository = "https://github.com/Sailero/SkyHAD"
Documentation = "https://github.com/Sailero/SkyHAD/tree/main/docs"
Changelog = "https://github.com/Sailero/SkyHAD/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["make_env"]

[tool.setuptools.packages.find]
where = ["."]
include = ["had_env*"]

[tool.setuptools.package-data]
"had_env" = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.dynamic]
version = {attr = "had_env.__version__"}
