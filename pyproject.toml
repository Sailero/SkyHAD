[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "had-env"
dynamic = ["version"]
description = "SkyHAD: heterogeneous aerial attack-defense with particle and six-DOF UAV models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11.4,<2",
  "gymnasium>=1.0,<2",
  "pettingzoo>=1.24,<2",
]

[project.optional-dependencies]
render = ["pygame>=2.5,<3"]
viewer = [
  "pygame>=2.5,<3",
  "PySide6>=6.8,<7",
  "matplotlib>=3.7,<4",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.5",
]
test = ["pytest>=8.4,<9"]

[project.scripts]
skyhad-workbench = "skyhad_workbench.cli:main"
had-workbench = "skyhad_workbench.cli:main"

[project.urls]
Repository = "https://github.com/Sailero/SkyHAD"
Documentation = "https://github.com/Sailero/SkyHAD/tree/main/docs"

[tool.setuptools]
py-modules = ["make_env"]

[tool.setuptools.packages.find]
where = ["."]
include = ["had_env*", "skyhad_workbench*"]

[tool.setuptools.package-data]
"had_env" = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.dynamic]
version = {attr = "had_env.__version__"}
